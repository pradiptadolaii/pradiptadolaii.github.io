rtant}}</style><style>.wall{background-image:url("assets/medtech-photo-options/mri.webp")!important;opacity:1!important}.wrap{margin-right:auto;margin-left:4vw}.card{background:color-mix(in srgb,var(--bg) 92%,transparent)}body{display:flex;align-items:center}.note{font-size:10px}.preview{background:var(--bg);padding:4px 8px;border-radius:4px}@media(max-width:700px){.wrap{margin:0 auto}.wall{background-position:65% center}}</style><style>.enter{position:relative;overflow:hidden;padding:17px 20px;text-align:left;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 6px 20px #00000012;transition:transform .25s,box-shadow .25s}.enter:hover{transform:translateY(-3px);box-shadow:0 12px 28px #00000024}.enter:active{transform:translateY(0)}.enter-copy{font-family:CM,Georgia,serif;font-size:23px;line-height:1.2}.enter-copy small{display:block;font:10px/1.5 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin-top:6px}.pulse-window{display:flex;align-items:center;gap:12px;width:116px}.pulse-window svg{width:82px;height:40px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pulse-line{stroke-dasharray:140;animation:heartbeat 3.2s linear infinite}.pulse-tick{display:none}.enter-arrow{font-size:22px;transition:transform .25s}.enter:hover .enter-arrow{transform:translate(3px,-3px)}.loading .enter{animation:none}.loading .pulse-line{animation:heartbeat .7s linear infinite}.success .pulse-line,.success .enter-arrow{display:none}.success .pulse-tick{display:block;stroke:#298363;stroke-width:3;stroke-dasharray:60;animation:confirmed .45s ease-out}.success .enter{border-color:#3aa67b}.card h1{margin-top:0}@keyframes heartbeat{0%{stroke-dashoffset:280;opacity:.5}35%,75%{opacity:1}100%{stroke-dashoffset:0;opacity:.5}}@keyframes confirmed{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.pulse-line{animation:none}.enter{transition:none}}</style></head><body><div class="wall" aria-hidden="true"></div><header class="top"><span class="brand">pd / Pradipta Dolai</span><button class="theme" aria-label="Toggle light and dark appearance">☾</button></header><div class="wrap"><main class="card"><h1>A little curiosity.<br>A world of possibility.</h1><p class="intro">Welcome to my portfolio. Explore the projects, ideas, and learning behind my work.</p><button class="enter" id="enter"><span class="enter-copy">Enter portfolio<small>Explore my work</small></span><span class="pulse-window" aria-hidden="true"><svg viewBox="0 0 90 40"><path class="pulse-line" d="M2 21h20l6-10 9 23 10-29 9 16h31"/><path class="pulse-tick" d="m28 21 11 11 23-25"/></svg><span class="enter-arrow">↗</span></span></button><p id="status" role="status" aria-live="polite"></p><div class="details">RESEARCH · ENGINEERING · INTELLIGENCE</div></main></div><script>const theme=document.querySelector('.theme');function sync(){theme.textContent=document.documentElement.dataset.theme==='dark'?'☀':'☾'}sync();theme.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';sync()};document.querySelector('#enter').onclick=()=>{const b=document.querySelector('#enter'),s=document.querySelector('#status');b.disabled=true;document.body.classList.add('loading');s.textContent='Opening your portfolio…';setTimeout(()=>{document.body.classList.remove('loading');document.body.classList.add('success');s.textContent='Welcome. Take a look around.';setTimeout(()=>{document.body.classList.add('leaving');setTimeout(()=>{try{sessionStorage.setItem('portfolio-entered','1')}catch{}location.href='index.html?entered=1#home'},450)},750)},750)};</script></body></html>
